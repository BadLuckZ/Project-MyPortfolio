<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio of Thanagorn Chaiyut, a Computer Engineering student at Chulalongkorn University and fullstack developer."
    />
    <title>Thanagorn Chaiyut | Fullstack Developer</title>
    <link rel="canonical" href="https://thanagorn.com/" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://thanagorn.com/" />
    <meta
      property="og:title"
      content="Thanagorn Chaiyut | Fullstack Developer"
    />
    <meta
      property="og:description"
      content="Portfolio of Thanagorn Chaiyut, a Computer Engineering student at Chulalongkorn University and fullstack developer"
    />
    <meta
      property="og:image"
      content="https://thanagorn.com/assets/img/profile/my_profile.jpg"
    />
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Thanagorn Chaiyut | Fullstack Developer"
    />
    <meta
      name="twitter:description"
      content="Portfolio of Thanagorn Chaiyut, a Computer Engineering student at Chulalongkorn University and fullstack developer"
    />
    <meta
      name="twitter:image"
      content="https://thanagorn.com/assets/img/profile/my_profile.jpg"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./css/index.css" />
  </head>
  <body>
    <header class="profile grid">
      <div class="profile-data">
        <div class="profile-border">
          <div class="profile-image-container">
            <img
              src="assets/img/profile/my_profile.jpg"
              alt="Thanagorn Chaiyut"
            />
          </div>
        </div>
        <h2 class="profile-name">Thanagorn Chaiyut</h2>
        <p class="profile-role">Fullstack Developer</p>
        <p class="profile-study">
          Computer Engineering, Chulalongkorn University
        </p>
      </div>
      <div class="profile-info grid">
        <div class="profile-info-group">
          <h3 class="profile-info-number" id="my-project-number"></h3>
          <p class="profile-info-description">Projects</p>
        </div>
        <div class="profile-info-group">
          <h3 class="profile-info-number" id="my-experience-number"></h3>
          <p class="profile-info-description">Experiences</p>
        </div>
      </div>
      <div class="profile-buttons">
        <a href="assets/pdf/cv_thanagorn_chaiyut.pdf" class="main-button">
          Download CV
          <i class="fa-sharp fa-solid fa-arrow-down"></i>
        </a>
        <div class="grid grid-col-2 sub-buttons">
          <a
            href="mailto:thanagorn8802@gmail.com"
            class="sub-button"
            aria-label="Email Thanagorn Chaiyut"
          >
            <i class="fa-solid fa-envelope" aria-hidden="true"></i>
          </a>
          <a
            href="tel:+66937255851"
            class="sub-button"
            aria-label="Call Thanagorn Chaiyut"
          >
            <i class="fa-solid fa-phone-volume" aria-hidden="true"></i>
          </a>
          <a
            href="https://github.com/BadLuckZ"
            target="_blank"
            rel="noopener noreferrer"
            class="sub-button"
            aria-label="GitHub profile"
          >
            <i class="fa-brands fa-github" aria-hidden="true"></i>
          </a>
          <a
            href="https://www.linkedin.com/in/thanagorn-chaiyut"
            target="_blank"
            rel="noopener noreferrer"
            class="sub-button"
            aria-label="LinkedIn profile"
          >
            <i class="fa-brands fa-linkedin" aria-hidden="true"></i
          ></a>
        </div>
      </div>
    </header>
    <main>
      <ul class="filter-content">
        <li>
          <button class="filter-button filter-active" data-target="#project">
            Projects
          </button>
        </li>
        <li>
          <button class="filter-button" data-target="#experience">
            Experiences
          </button>
        </li>
      </ul>
      <div class="filter-sections">
        <div
          class="project-content content-active"
          data-content
          id="project"
        ></div>
        <div class="experience-content" data-content id="experience"></div>
      </div>
    </main>
    <script src="js/filter.js"></script>
    <script type="module" src="js/projects/showProject.js"></script>
    <script type="module" src="js/experiences/showExperience.js"></script>
  </body>
</html>
